rcp_jerky = "Sun-Dried Jerky | de:Sonnen-Dörrfleisch | min_level:2 | ingredients:mat_meat:2,mat_sunstone:1 | hunger:45 | energy:20 | xp:60 | icon:🥩 | desc:Cured under the intense desert sun | desc_de:Unter intensiver Wüstensonne getrocknet"
rcp_berry_pie = "Forest Berry Tart | de:Waldbeeren-Tarte | min_level:3 | ingredients:mat_herb:1,mat_mushroom:1 | hunger:35 | hp:15 | xp:80 | icon:🥧 | desc:Sweet wild forest berries baked in campfire oven | desc_de:Süße Waldbeeren, duftend gebacken am gemütlichen Lagerfeuer"
rcp_stew = "Kelp & Mushroom Stew | de:Tang- & Pilzeintopf | min_level:4 | ingredients:mat_mushroom:2,mat_kelp:2 | hunger:60 | hp:30 | mana:25 | xp:110 | icon:🍲 | desc:Steaming pot infused with forest truffles & ocean minerals | desc_de:Dampfender Eintopf verfeinert mit Waldpilzen und Meeresmineralien"

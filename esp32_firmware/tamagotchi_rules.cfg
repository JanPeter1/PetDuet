# ==============================================================================
# TAMAGOTCHI RPG GAME MECHANICS CONFIGURATION
# Human-Readable Runtime Ruleset (INI / TOML / CFG Format)
# Can be edited without recompiling. Read at runtime on Web, Android & ESP32.
# ==============================================================================

[general]
game_title = "CYD Tamagotchi RPG"
version = "2.0.0"
max_stat_value = 100
tick_rate_seconds = 6.0
socket_port = 8888
base_xp_requirement = 100
xp_level_multiplier = 1.30

# Stat decay rates per game tick (every 6 seconds)
[decay_rates]
hunger_decay = 1
energy_decay = 1
hygiene_decay = 0
happiness_decay = 1
health_starve_decay = 1
starve_threshold = 20
natural_mana_regen = 2

# Evolution milestones based on Pet Level
[evolution_phases]
egg_warmth_required = 100
baby_min_level = 1
youth_min_level = 4
adult_min_level = 8
elder_min_level = 15

# Biome definitions: palettes, behavior traits, and perks
[biome.desert]
name = "Desert"
color_hex = "#f59e0b"
rgb565 = "0xFD40"
trait = "Solar Resilience"
description = "Scorching dunes. Pets love sunshine and develop heat aura."
growth_requirement = "Needs regular hydration & sunstones."
energy_bonus_pct = 25
hunger_decay_bonus_pct = 15

[biome.grassland]
name = "Grassland"
color_hex = "#10b981"
rgb565 = "0x2E69"
trait = "Verdant Vitality"
description = "Lush green rolling meadows. Rich in herbs and fast recovery."
growth_requirement = "Needs frequent outdoor games and vegetable snacks."
energy_bonus_pct = 0
hunger_decay_bonus_pct = 0

[biome.water]
name = "Water"
color_hex = "#06b6d4"
rgb565 = "0x1DCF"
trait = "Tidal Affinity"
description = "Crystal lagoons and ocean reefs. Agile aquatic pets."
growth_requirement = "Needs frequent bubble baths to keep gills pristine."
energy_bonus_pct = 10
hunger_decay_bonus_pct = -10

[biome.forest]
name = "Forest"
color_hex = "#8d6e63"
rgb565 = "0x8BE3"
trait = "Ancient Stamina"
description = "Whispering mossy canopy. Superior wood & mushroom forage."
growth_requirement = "Thrives on mushroom stews and shaded naps."
energy_bonus_pct = 15
hunger_decay_bonus_pct = 5

# Seasonal cycles and environmental multipliers
[seasons]
spring_forage_bonus_pct = 20
summer_thirst_decay_pct = 25
autumn_cook_xp_bonus_pct = 50
winter_rest_energy_bonus_pct = 100


# ==============================================================================
# TAMAGOTCHI RPG GAME MECHANICS CONFIGURATION FOR ESP32 CYD
# Placed on SD card (/sd/tamagotchi_rules.cfg) or SPIFFS or embedded flash.
# ==============================================================================

[general]
game_title = "CYD Tamagotchi RPG"
version = "2.0.0"
max_stat_value = 100
tick_rate_seconds = 6.0
socket_port = 8888
base_xp_requirement = 100
xp_level_multiplier = 1.30

[decay_rates]
hunger_decay = 1
energy_decay = 1
hygiene_decay = 0
happiness_decay = 1
health_starve_decay = 1
starve_threshold = 20
natural_mana_regen = 2

[evolution_phases]
egg_warmth_required = 100
baby_min_level = 1
youth_min_level = 4
adult_min_level = 8
elder_min_level = 15

[biome.desert]
name = "Desert"
color_hex = "#f59e0b"
rgb565 = "0xFD40"
trait = "Solar Resilience"
energy_bonus_pct = 25
hunger_decay_bonus_pct = 15

[biome.grassland]
name = "Grassland"
color_hex = "#10b981"
rgb565 = "0x2E69"
trait = "Verdant Vitality"
energy_bonus_pct = 0
hunger_decay_bonus_pct = 0

[biome.water]
name = "Water"
color_hex = "#06b6d4"
rgb565 = "0x1DCF"
trait = "Tidal Affinity"
energy_bonus_pct = 10
hunger_decay_bonus_pct = -10

[biome.forest]
name = "Forest"
color_hex = "#8d6e63"
rgb565 = "0x8BE3"
trait = "Ancient Stamina"
energy_bonus_pct = 15
hunger_decay_bonus_pct = 5

[social_actions]
treat_send_hunger_gain = 25
treat_send_happiness_gain = 20
treat_send_xp_reward = 30
coop_quest_coins_reward = 40
coop_quest_xp_reward = 50
coop_magic_hp_boost = 30
coop_magic_happiness_boost = 25


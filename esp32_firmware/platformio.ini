; ============================================================================
; PlatformIO Configuration for ESP32 Cheap Yellow Display (ESP32-2432S028R)
; Hardware: 2.8" 320x240 ILI9341 SPI TFT + XPT2046 Resistive Touch
; Framework: Arduino (with TFT_eSPI and LVGL)
; ============================================================================

[platformio]
default_envs = esp32-2432s028r
src_dir = .

[env:esp32-2432s028r]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
src_filter = +<*> -<main/> -<components/> -<src/>

; Dual A/B OTA partition scheme (1.5MB app0, 1.5MB app1, 896KB SPIFFS for rules)
board_build.partitions = partitions.csv

build_flags =
    -D CORE_DEBUG_LEVEL=0
    ; TFT_eSPI Display Hardware Settings for CYD
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=240
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    ; LVGL support
    -D LV_CONF_INCLUDE_SIMPLE=1
    -D LV_USE_LOG=1

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson @ ^6.21.3
    lvgl/lvgl @ ^8.3.11
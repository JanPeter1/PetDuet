; ============================================================================
; PlatformIO Configuration for ESP32 Cheap Yellow Display (ESP32-2432S028R)
; Hardware: 2.8" 320x240 ILI9341 SPI TFT + XPT2046 Resistive Touch
; Framework: Native ESP-IDF + LVGL v8.3
; ============================================================================

[platformio]
default_envs = esp32-2432s028r
src_dir = main

[env:esp32-2432s028r]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_speed = 921600

; Dual A/B OTA partition scheme (1.5MB app0, 1.5MB app1, 896KB SPIFFS for rules)
board_build.partitions = partitions.csv

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE=1
    -Imain

lib_deps =
    lvgl/lvgl @ ^8.3.11
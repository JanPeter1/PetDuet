<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes floatZ {
        0% { transform: translateY(2px) translateX(0px); opacity: 0.4; }
        50% { transform: translateY(-2px) translateX(1px); opacity: 1; }
        100% { transform: translateY(-5px) translateX(2px); opacity: 0; }
      }
      .anim-z1 { animation: floatZ 2.2s ease-in-out infinite; }
      .anim-z2 { animation: floatZ 2.2s ease-in-out infinite 0.7s; }
      .anim-z3 { animation: floatZ 2.2s ease-in-out infinite 1.4s; }
    </style>
  </defs>
  <!-- Small z -->
  <g class="anim-z1">
    <path d="M 4 16 H 8 V 17 H 6 V 18 H 4 V 19 H 8 V 20 H 3 V 19 H 5 V 18 H 7 V 17 H 3 V 16 Z" fill="#38bdf8" />
  </g>
  <!-- Medium Z -->
  <g class="anim-z2">
    <path d="M 9 9 H 14 V 10 H 12 V 11 H 10 V 12 H 14 V 13 H 8 V 12 H 10 V 11 H 12 V 10 H 8 V 9 Z" fill="#60a5fa" />
  </g>
  <!-- Large Z -->
  <g class="anim-z3">
    <path d="M 15 2 H 22 V 4 H 19 V 5 H 17 V 6 H 22 V 8 H 14 V 6 H 16 V 5 H 18 V 4 H 14 V 2 Z" fill="#818cf8" />
    <rect x="16" y="3" width="3" height="1" fill="#c7d2fe" />
  </g>
</svg>

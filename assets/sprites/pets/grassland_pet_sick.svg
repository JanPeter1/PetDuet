<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes sickTremble {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-1px); }
        75% { transform: translateX(1px); }
      }
      @keyframes sweatDropPulse {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(2px); }
      }
      .anim-shiver { animation: sickTremble 0.15s infinite; }
      .anim-drop { animation: sweatDropPulse 0.8s infinite; }
    </style>
  </defs>

  <ellipse cx="24" cy="45" rx="14" ry="3" fill="#0f172a" opacity="0.4" />

  <!-- Animated Sweat Drop on head -->
  <g class="anim-drop">
    <path d="M 33 12 H 35 V 14 H 37 V 17 H 35 V 19 H 33 V 17 H 31 V 14 H 33 Z" fill="#0284c7" />
    <rect x="33" y="14" width="2" height="3" fill="#7dd3fc" />
  </g>

  <g class="anim-shiver">
    <!-- Drooped Wilted Ears -->
    <path d="M 12 12 H 16 V 20 H 12 Z" fill="#064e3b" />
    <path d="M 13 13 H 15 V 19 H 13 Z" fill="#34d399" />
    <path d="M 32 12 H 36 V 20 H 32 Z" fill="#064e3b" />
    <path d="M 33 13 H 35 V 19 H 33 Z" fill="#34d399" />
    <!-- Wilted Sprout -->
    <rect x="23" y="14" width="2" height="4" fill="#047857" />
    <path d="M 24 16 H 28 V 19 H 24 Z" fill="#6ee7b7" />

    <!-- Sick Pale Green/Purplish Body Outline -->
    <path d="M 14 16 H 34 V 18 H 38 V 24 H 40 V 38 H 38 V 42 H 34 V 44 H 14 V 42 H 10 V 38 H 8 V 24 H 10 V 18 H 14 Z" fill="#1e293b" />
    <path d="M 14 18 H 34 V 24 H 38 V 38 H 34 V 42 H 14 V 38 H 10 V 24 H 14 Z" fill="#6ee7b7" />

    <!-- Sick Pale Belly -->
    <path d="M 18 30 H 30 V 40 H 18 Z" fill="#e2e8f0" />

    <!-- Blue Shivering Cheeks -->
    <rect x="12" y="30" width="3" height="2" fill="#38bdf8" />
    <rect x="33" y="30" width="3" height="2" fill="#38bdf8" />

    <!-- Downcast Teary Eyes -->
    <path d="M 17 26 H 20 V 28 H 17 Z" fill="#0f172a" />
    <path d="M 28 26 H 31 V 28 H 28 Z" fill="#0f172a" />
    <!-- Little Tear Drops -->
    <rect x="19" y="28" width="1" height="2" fill="#38bdf8" />
    <rect x="30" y="28" width="1" height="2" fill="#38bdf8" />

    <!-- Trembling Wobbly Mouth -->
    <path d="M 22 31 H 24 V 32 H 26 V 31 H 27" stroke="#0f172a" strokeWidth="1" />
  </g>
</svg>

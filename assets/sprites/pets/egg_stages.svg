<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 48" width="120" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes eggPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      @keyframes eggWobble {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-3deg); }
        75% { transform: rotate(3deg); }
      }
      .anim-stage1 { transform-origin: 20px 24px; animation: eggPulse 2s ease-in-out infinite; }
      .anim-stage2 { transform-origin: 60px 24px; animation: eggWobble 0.6s ease-in-out infinite; }
      .anim-stage3 { transform-origin: 100px 24px; animation: eggPulse 1s ease-in-out infinite; }
    </style>
  </defs>

  <!-- STAGE 1: INTACT EGG -->
  <g class="anim-stage1">
    <ellipse cx="20" cy="42" rx="10" ry="2.5" fill="#0f172a" opacity="0.3" />
    <!-- Egg Shell Outline -->
    <path d="M 16 10 H 24 V 12 H 28 V 18 H 30 V 32 H 28 V 38 H 24 V 40 H 16 V 38 H 12 V 32 H 10 V 18 H 12 V 12 H 16 Z" fill="#064e3b" />
    <!-- Egg Fill -->
    <path d="M 16 12 H 24 V 18 H 28 V 32 H 24 V 38 H 16 V 32 H 12 V 18 H 16 Z" fill="#10b981" />
    <!-- Soft Spotted Spots -->
    <rect x="14" y="22" width="3" height="3" fill="#6ee7b7" />
    <rect x="22" y="16" width="2" height="2" fill="#6ee7b7" />
    <rect x="23" y="28" width="3" height="3" fill="#6ee7b7" />
    <!-- Shading -->
    <path d="M 14 34 H 26 V 38 H 14 Z" fill="#047857" />
  </g>

  <!-- STAGE 2: WARM CRACKED EGG -->
  <g class="anim-stage2">
    <ellipse cx="60" cy="42" rx="10" ry="2.5" fill="#0f172a" opacity="0.3" />
    <!-- Glow Aura -->
    <path d="M 52 14 H 68 V 36 H 52 Z" fill="#fbbf24" opacity="0.2" />
    <!-- Egg Shell Outline -->
    <path d="M 56 10 H 64 V 12 H 68 V 18 H 70 V 32 H 68 V 38 H 64 V 40 H 56 V 38 H 52 V 32 H 50 V 18 H 52 V 12 H 56 Z" fill="#064e3b" />
    <!-- Egg Fill -->
    <path d="M 56 12 H 64 V 18 H 68 V 32 H 64 V 38 H 56 V 32 H 52 V 18 H 56 Z" fill="#10b981" />
    <!-- Fractured Cracks with golden light leaking out -->
    <path d="M 60 14 L 57 20 L 62 24 L 58 30 L 63 34" stroke="#fef08a" strokeWidth="2" fill="none" />
    <path d="M 60 14 L 57 20 L 62 24 L 58 30 L 63 34" stroke="#064e3b" strokeWidth="0.8" fill="none" />
    <rect x="65" y="22" width="2" height="2" fill="#fef08a" />
  </g>

  <!-- STAGE 3: HATCHING PEEK -->
  <g class="anim-stage3">
    <ellipse cx="100" cy="42" rx="10" ry="2.5" fill="#0f172a" opacity="0.3" />
    <!-- Bottom Half Shell -->
    <path d="M 96 26 H 104 V 28 H 108 V 38 H 104 V 40 H 96 V 38 H 92 V 28 H 96 Z" fill="#064e3b" />
    <path d="M 96 28 H 104 V 38 H 96 Z" fill="#10b981" />
    <!-- Jagged Shell Top Edge -->
    <path d="M 92 26 L 94 28 L 97 25 L 100 29 L 103 26 L 106 29 L 108 26" stroke="#064e3b" strokeWidth="1" fill="none" />
    <!-- Peeking Critter Head -->
    <rect x="95" y="16" width="10" height="10" fill="#34d399" />
    <!-- Cute Peeking Eyes -->
    <rect x="97" y="19" width="2" height="3" fill="#0f172a" />
    <rect x="97" y="19" width="1" height="1" fill="#ffffff" />
    <rect x="101" y="19" width="2" height="3" fill="#0f172a" />
    <rect x="101" y="19" width="1" height="1" fill="#ffffff" />
    <!-- Little Sprout Pop -->
    <rect x="99" y="12" width="2" height="4" fill="#047857" />
    <path d="M 97 10 H 103 V 12 H 97 Z" fill="#6ee7b7" />
    <!-- Top Egg Shell Hat -->
    <path d="M 94 8 H 106 V 11 L 104 14 L 100 12 L 96 14 Z" fill="#10b981" stroke="#064e3b" strokeWidth="1" />
  </g>
</svg>

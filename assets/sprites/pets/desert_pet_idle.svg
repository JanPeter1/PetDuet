<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes sunscaleBreathe {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-1px); }
      }
      .anim-desert { transform-origin: 24px 44px; animation: sunscaleBreathe 1.8s ease-in-out infinite; }
    </style>
  </defs>

  <ellipse cx="24" cy="45" rx="14" ry="3" fill="#0f172a" opacity="0.4" />

  <g class="anim-desert">
    <!-- Sunscale Crest / Horns -->
    <path d="M 12 8 H 16 V 16 H 12 Z M 32 8 H 36 V 16 H 32 Z M 22 5 H 26 V 14 H 22 Z" fill="#78350f" />
    <path d="M 13 9 H 15 V 15 H 13 Z M 33 9 H 35 V 15 H 33 Z M 23 6 H 25 V 13 H 23 Z" fill="#d97706" />
    <rect x="23" y="8" width="2" height="3" fill="#fde047" />

    <!-- Main Body Outline -->
    <path d="M 14 16 H 34 V 18 H 38 V 24 H 40 V 38 H 38 V 42 H 34 V 44 H 14 V 42 H 10 V 38 H 8 V 24 H 10 V 18 H 14 Z" fill="#78350f" />
    <!-- Main Body Fill (Golden Amber) -->
    <path d="M 14 18 H 34 V 24 H 38 V 38 H 34 V 42 H 14 V 38 H 10 V 24 H 14 Z" fill="#f59e0b" />
    <!-- Warm Sun Belly -->
    <path d="M 18 30 H 30 V 40 H 18 Z" fill="#fef3c7" />

    <!-- Desert Cheeks -->
    <rect x="12" y="30" width="3" height="2" fill="#f87171" />
    <rect x="33" y="30" width="3" height="2" fill="#f87171" />

    <!-- Amber Alert Eyes -->
    <rect x="17" y="25" width="3" height="4" fill="#451a03" />
    <rect x="17" y="25" width="1" height="2" fill="#ffffff" />
    <rect x="28" y="25" width="3" height="4" fill="#451a03" />
    <rect x="28" y="25" width="1" height="2" fill="#ffffff" />

    <!-- Mouth -->
    <rect x="23" y="30" width="2" height="1" fill="#78350f" />

    <!-- Cute Reptilian Lizard Tail curl on right -->
    <path d="M 38 34 H 44 V 38 H 42 V 40 H 38 Z" fill="#d97706" />
  </g>
</svg>
